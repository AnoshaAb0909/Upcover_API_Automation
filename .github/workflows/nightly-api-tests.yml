name: Nightly API Tests

on:
  schedule:
    # 6:00 AM AEST (UTC+10) = 20:00 UTC the previous calendar day
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment(s)
        type: choice
        options:
          - dev
          - staging
          - both
        default: dev

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Nightly schedule runs dev only. Staging is available via workflow_dispatch.
        # environment: ${{ github.event_name == 'schedule' && fromJSON('["dev","staging"]') || ...
        environment: ${{ github.event_name == 'schedule' && fromJSON('["dev"]') || (github.event.inputs.environment == 'both' && fromJSON('["dev","staging"]') || fromJSON(format('["{0}"]', github.event.inputs.environment))) }}

    name: api-tests (${{ matrix.environment }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure target environment
        env:
          DEV_BASE_URL: ${{ secrets.BASE_URL }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          DEV_STRIPE_ANNUAL: ${{ secrets.STRIPE_SECRET_KEY_ANNUAL }}
          DEV_STRIPE_MONTHLY: ${{ secrets.STRIPE_SECRET_KEY_MONTHLY }}
          DEV_STRIPE_LEGACY: ${{ secrets.STRIPE_SECRET_KEY }}
          STAGING_STRIPE_ANNUAL: ${{ secrets.STAGING_STRIPE_SECRET_KEY_ANNUAL }}
          STAGING_STRIPE_MONTHLY: ${{ secrets.STAGING_STRIPE_SECRET_KEY_MONTHLY }}
          STAGING_STRIPE_LEGACY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          DEV_PM_ANNUAL: ${{ secrets.FALLBACK_ANNUAL_PAYMENT_METHOD_ID }}
          DEV_PM_MONTHLY: ${{ secrets.FALLBACK_MONTHLY_PAYMENT_METHOD_ID }}
          STAGING_PM_ANNUAL: ${{ secrets.STAGING_FALLBACK_ANNUAL_PAYMENT_METHOD_ID }}
          STAGING_PM_MONTHLY: ${{ secrets.STAGING_FALLBACK_MONTHLY_PAYMENT_METHOD_ID }}
        run: |
          if [ "${{ matrix.environment }}" = "staging" ]; then
            if [ -z "$STAGING_BASE_URL" ]; then
              echo "STAGING_BASE_URL secret is required for staging runs."
              exit 1
            fi
            echo "BASE_URL=$STAGING_BASE_URL" >> "$GITHUB_ENV"
            echo "STRIPE_SECRET_KEY_ANNUAL=${STAGING_STRIPE_ANNUAL:-$DEV_STRIPE_ANNUAL}" >> "$GITHUB_ENV"
            echo "STRIPE_SECRET_KEY_MONTHLY=${STAGING_STRIPE_MONTHLY:-$DEV_STRIPE_MONTHLY}" >> "$GITHUB_ENV"
            echo "STRIPE_SECRET_KEY=${STAGING_STRIPE_LEGACY:-$DEV_STRIPE_LEGACY}" >> "$GITHUB_ENV"
            echo "FALLBACK_ANNUAL_PAYMENT_METHOD_ID=${STAGING_PM_ANNUAL:-$DEV_PM_ANNUAL}" >> "$GITHUB_ENV"
            echo "FALLBACK_MONTHLY_PAYMENT_METHOD_ID=${STAGING_PM_MONTHLY:-$DEV_PM_MONTHLY}" >> "$GITHUB_ENV"
          else
            echo "BASE_URL=$DEV_BASE_URL" >> "$GITHUB_ENV"
            echo "STRIPE_SECRET_KEY_ANNUAL=$DEV_STRIPE_ANNUAL" >> "$GITHUB_ENV"
            echo "STRIPE_SECRET_KEY_MONTHLY=$DEV_STRIPE_MONTHLY" >> "$GITHUB_ENV"
            echo "STRIPE_SECRET_KEY=$DEV_STRIPE_LEGACY" >> "$GITHUB_ENV"
            echo "FALLBACK_ANNUAL_PAYMENT_METHOD_ID=$DEV_PM_ANNUAL" >> "$GITHUB_ENV"
            echo "FALLBACK_MONTHLY_PAYMENT_METHOD_ID=$DEV_PM_MONTHLY" >> "$GITHUB_ENV"
          fi
          echo "TARGET_ENV=${{ matrix.environment }}" >> "$GITHUB_ENV"

      - name: Run API tests
        id: tests
        env:
          GUEST_EMAIL: ${{ secrets.GUEST_EMAIL }}
          REQUEST_TIMEOUT: 300000
          COALITION_QUICK_QUOTE_PATH: /coalition/quick-quote
          COALITION_FULL_QUOTE_PATH: /coalition/full-quote
          COALITION_PAYMENTS_PATH: /coalition/payments
          COALITION_MONTHLY_PAYMENTS_PATH: /coalition/payments/monthly
          COALITION_COUPON_ID: ec92858ce2
          COALITION_QUOTE_DOCS_EMAIL_PATH: /coalition/quote-docs/email
          COALITION_PROOF_OF_INSURANCE_EMAIL_PATH: /coalition/proof-of-insurance/email
          QUOTE_DOCS_TIMEOUT: 120000
          VIZ_QUICK_QUOTE_PATH: /viz/quick-quote
          VIZ_FULL_QUOTE_PATH: /viz/full-quote
          VIZ_PAYMENTS_PATH: /viz/payments
          VIZ_MONTHLY_PAYMENTS_PATH: /viz/payments/monthly
          VIZ_ENDORSEMENT_PATH: /viz/full-quote/endorsement
          VIZ_ENDORSEMENT_PAYMENTS_PATH: /viz/payments/endorsement
          VIZ_ENDORSEMENT_MONTHLY_PAYMENTS_PATH: /viz/payments/endorsement/monthly
          VIZ_QUOTE_DOCS_EMAIL_PATH: /viz/quote-docs/email
          VIZ_PROOF_OF_INSURANCE_EMAIL_PATH: /viz/proof-of-insurance/email
          AHP_QUICK_QUOTE_PATH: /quickQuote
          AHP_FULL_QUOTE_PATH: /fullQuote
          AHP_PAYMENTS_PATH: /payment
          AHP_MONTHLY_PAYMENTS_PATH: /payment/monthly
        run: |
          npm run test:ci -- --json --outputFile=reports/test-results-${{ matrix.environment }}.json

      - name: Upload HTML report
        if: always() && hashFiles('reports/test-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.environment }}-${{ github.run_id }}
          path: reports/test-report.html
          retention-days: 14

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          HAS_REPORT: ${{ hashFiles('reports/test-report.html') != '' }}
          TARGET_ENV: ${{ matrix.environment }}
          BASE_URL: ${{ env.BASE_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set — skipping Slack notification."
            exit 0
          fi

          case "$TEST_OUTCOME" in
            success) COLOR="#36a64f" ;;
            failure) COLOR="#e01e5a" ;;
            *)       COLOR="#ecb22e" ;;
          esac

          if [ -f "reports/test-results-${TARGET_ENV}.json" ]; then
            PASSED=$(jq -r '.numPassedTests // 0' "reports/test-results-${TARGET_ENV}.json")
            FAILED=$(jq -r '.numFailedTests // 0' "reports/test-results-${TARGET_ENV}.json")
            TOTAL=$(jq -r '.numTotalTests // 0' "reports/test-results-${TARGET_ENV}.json")
            STATUS="${PASSED} passed · ${FAILED} failed (${TOTAL} total)"
            PRODUCT_SUMMARY=$(jq -r '
              def product_from_path($path):
                if ($path | test("/products/coalition/")) then "Coalition"
                elif ($path | test("/products/viz/")) then "Viz"
                elif ($path | test("/products/ahp/")) then "AHP"
                elif ($path | test("/products/ppl/")) then "PPL"
                elif ($path | test("/products/cyber/")) then "Cyber"
                elif ($path | test("/auth/")) then "Auth"
                else "Other"
                end;

              [.testResults[] |
                .name as $path |
                product_from_path($path) as $product |
                .assertionResults[] | {product: $product, status: .status}
              ] | group_by(.product) | sort_by(.[0].product) | map(
                .[0].product as $product |
                (map(select(.status == "passed")) | length) as $passed |
                (map(select(.status == "failed")) | length) as $failed |
                "*\($product):* \($passed) passed · \($failed) failed"
              ) | join("\n")
            ' "reports/test-results-${TARGET_ENV}.json")
            if [ "$FAILED" -gt 0 ]; then
              COLOR="#e01e5a"
            elif [ "$TOTAL" -gt 0 ]; then
              COLOR="#36a64f"
            fi
          else
            PASSED="?"
            FAILED="?"
            TOTAL="?"
            STATUS="Test results unavailable"
            PRODUCT_SUMMARY="Product breakdown unavailable"
          fi

          if [ "$HAS_REPORT" = "true" ]; then
            REPORT_NOTE="Download the HTML report from the *Artifacts* section on the run page."
          else
            REPORT_NOTE="No HTML report was generated for this run."
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TRIGGER="${{ github.event_name }}"

          jq -n \
            --arg color "$COLOR" \
            --arg status "$STATUS" \
            --arg product_summary "$PRODUCT_SUMMARY" \
            --arg run_number "${{ github.run_number }}" \
            --arg trigger "$TRIGGER" \
            --arg branch "${{ github.ref_name }}" \
            --arg run_url "$RUN_URL" \
            --arg report_note "$REPORT_NOTE" \
            --arg target_env "$TARGET_ENV" \
            --arg base_url "$BASE_URL" \
            '{
              attachments: [{
                color: $color,
                blocks: [
                  {
                    type: "header",
                    text: { type: "plain_text", text: ("Upcover API Test Report (" + $target_env + ")") }
                  },
                  {
                    type: "section",
                    fields: [
                      { type: "mrkdwn", text: ("*Result:*\n" + $status) },
                      { type: "mrkdwn", text: ("*Run:*\n#" + $run_number) }
                    ]
                  },
                  {
                    type: "section",
                    fields: [
                      { type: "mrkdwn", text: ("*Environment:*\n" + $target_env) },
                      { type: "mrkdwn", text: ("*Base URL:*\n" + $base_url) }
                    ]
                  },
                  {
                    type: "section",
                    text: { type: "mrkdwn", text: $product_summary }
                  },
                  {
                    type: "section",
                    fields: [
                      { type: "mrkdwn", text: ("*Trigger:*\n" + $trigger) },
                      { type: "mrkdwn", text: ("*Branch:*\n" + $branch) }
                    ]
                  },
                  {
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: ("<" + $run_url + "|View run on GitHub Actions>\n" + $report_note)
                    }
                  }
                ]
              }]
            }' | curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data @-
